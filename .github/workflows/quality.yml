name: TMADS quality checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Django tests (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tmads
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: tmads
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tmads -d tmads"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings.local
      APP_ENV: LOCAL
      SECRET_KEY: ci-only-not-a-production-secret
      DATABASE_URL: postgresql://tmads:ci-only@127.0.0.1:5432/tmads
      TELEGRAM_ADS_API_TOKEN: ""
      TELEGRAM_ADS_WRITE_ENABLED: "false"
      TELEGRAM_ADS_PAID_SUBMISSION_ENABLED: "false"
      TELEGRAM_ADS_MEDIA_UPLOAD_ENABLED: "false"
      TELEGRAM_ADS_RELATED_ACCOUNTS_ENABLED: "false"
      TELEGRAM_ADS_WEBSITE_ENABLED: "false"
      TELEGRAM_ADS_CUSTOMER_ASSETS_ENABLED: "false"
      PAYMENT_GATEWAY: fake
      PAYMENT_FAKE_ENABLED: "true"
      ZARINPAL_MERCHANT_ID: ""
      ZARINPAL_SANDBOX: "true"
      NOBITEX_API_BASE_URL: http://127.0.0.1:1
      NOBITEX_HTTP_TIMEOUT_SECONDS: "1"
      NOBITEX_HTTP_RETRIES: "0"
      GRAMADS_BOT_TOKEN: "000000000:CI-GRAMADS-BOT-TOKEN"
      GRAMADS_BOT_WEBHOOK_SECRET: "ci-webhook-secret"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        id: install
        run: python -m pip install -r requirements.txt
      - name: Django system checks
        id: django
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python manage.py check
      - name: Check migration drift
        id: drift
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python manage.py makemigrations --check --dry-run
      - name: Apply migrations to empty database
        id: migrate
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python manage.py migrate --noinput
      - name: Collect static assets
        id: static
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python manage.py collectstatic --noinput
      - name: Check JavaScript syntax
        id: js
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        run: find static/js -name '*.js' -print0 | xargs -0 -r -n1 node --check
      - name: Run all automated Django tests
        id: pytest
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python -m pytest -ra --tb=short --junitxml=ci-test-results.xml
      - name: Publish quality report
        if: always()
        env:
          INSTALL_RESULT: ${{ steps.install.outcome }}
          DJANGO_RESULT: ${{ steps.django.outcome }}
          DRIFT_RESULT: ${{ steps.drift.outcome }}
          MIGRATE_RESULT: ${{ steps.migrate.outcome }}
          STATIC_RESULT: ${{ steps.static.outcome }}
          JS_RESULT: ${{ steps.js.outcome }}
          PYTEST_RESULT: ${{ steps.pytest.outcome }}
        run: |
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          checks = [
              ("Install dependencies", "INSTALL_RESULT"),
              ("Django system checks", "DJANGO_RESULT"),
              ("Migration drift", "DRIFT_RESULT"),
              ("Fresh database migration", "MIGRATE_RESULT"),
              ("Static assets", "STATIC_RESULT"),
              ("JavaScript syntax", "JS_RESULT"),
              ("All pytest tests", "PYTEST_RESULT"),
          ]
          lines = ["## TMADS quality report (PostgreSQL)", "",
                   "| Check | Result |", "| --- | --- |"]
          for label, key in checks:
              lines.append(f"| {label} | {os.environ.get(key) or 'not run'} |")
          report = Path("ci-test-results.xml")
          if report.is_file():
              root = ET.parse(report).getroot()
              suites = [root] if root.tag == "testsuite" else root.findall("testsuite")
              totals = {key: sum(int(s.get(key, 0)) for s in suites)
                        for key in ("tests", "failures", "errors", "skipped")}
              passed = totals["tests"] - totals["failures"] - totals["errors"] - totals["skipped"]
              lines += ["", f"**Tests:** {totals['tests']} | **Passed:** {passed} | "
                        f"**Failed:** {totals['failures']} | **Errors:** {totals['errors']} | "
                        f"**Skipped:** {totals['skipped']}"]
          else:
              lines += ["", "No pytest report was produced; no test pass is certified."]
          lines += ["", "No live payment, Telegram write, or browser E2E is attempted by this workflow."]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              out.write("\n".join(lines) + "\n")
          PY
      - name: Save test report
        if: ${{ always() && steps.pytest.outcome != 'skipped' && steps.pytest.outcome != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: django-test-results
          path: ci-test-results.xml
          if-no-files-found: warn
          retention-days: 7
