<div class="row-actions__group">
  <a class="btn btn-ghost btn-sm campaigns-table__link-btn" href="{% url 'campaigns:detail' campaign.id %}">مشاهده</a>
  {% if campaign.status == 'draft' %}
  <a class="campaigns-table__link-btn" href="{% url 'campaigns:wizard' campaign.id %}">ادامه پیش‌نویس</a>
  <details class="row-actions__overflow" data-disclosure-menu>
    <summary class="btn btn-ghost btn-sm row-actions__more" aria-label="عملیات بیشتر برای {{ campaign.name|default:'کمپین' }}">{% include "includes/gramads_workspace_icon.html" with name="ellipsis" size="sm" %}</summary>
    <div class="row-actions__menu">
      {% include "includes/campaign_delete_form.html" with campaign=campaign %}
    </div>
  </details>
  {% endif %}
</div>
