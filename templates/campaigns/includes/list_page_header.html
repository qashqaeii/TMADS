<header class="dash-header dash-header--luxe campaigns-list-hero" aria-label="سرفصل کمپین‌ها">
  <div class="dash-header__main campaigns-list-hero__lead">
    <h1>کمپین‌ها</h1>
    <span class="campaigns-list-hero__rule" aria-hidden="true"></span>
    <p class="campaigns-list-hero__sub">مدیریت پیش‌نویس‌ها و پایش تبلیغات</p>
  </div>
  <div class="dash-header__actions campaigns-list-hero__actions">
    <form method="post" action="{% url 'campaigns:refresh_stats' %}" class="campaigns-list-hero__form">{% csrf_token %}
      <button type="submit" class="campaign-detail__action campaigns-hero__action campaigns-hero__action--refresh campaign-detail__action--refresh">
        <span class="campaign-detail__action-icon" aria-hidden="true">{% include "includes/lucide_icon.html" with name="refresh-cw" size="sm" %}</span>
        <span class="campaign-detail__action-label">به‌روزرسانی آمار</span>
      </button>
    </form>
    <a class="campaign-detail__action campaigns-hero__action campaigns-hero__action--create" href="{% url 'campaigns:wizard_new' %}">
      <span class="campaign-detail__action-icon" aria-hidden="true">{% include "includes/lucide_icon.html" with name="plus" size="sm" %}</span>
      <span class="campaign-detail__action-label">ساخت تبلیغ</span>
    </a>
  </div>
</header>
