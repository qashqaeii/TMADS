<header class="dash-header ui-page-heading dash-header--luxe campaigns-list-hero" aria-label="سرفصل کمپین‌ها">
  <div class="dash-header__main campaigns-list-hero__lead">
    <span class="ga-page-heading-icon" aria-hidden="true">{% include "includes/gramads_workspace_icon.html" with name="megaphone" size="md" %}</span><h1>کمپین‌ها</h1>
    <span class="campaigns-list-hero__rule" aria-hidden="true"></span>
    <p class="campaigns-list-hero__sub">مدیریت پیش‌نویس‌ها و پایش تبلیغات</p>

  <div class="dash-header__actions campaigns-list-hero__actions">

      <span class="campaign-detail__action-icon" aria-hidden="true">{% include "includes/gramads_workspace_icon.html" with name="plus" size="sm" %}</span>
