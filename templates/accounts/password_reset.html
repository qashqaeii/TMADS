{% extends "public_base.html" %}
{% block title %}بازیابی رمز — {{ PRODUCT_NAME }}{% endblock %}
{% block content %}
<section class="auth-screen">
  <div class="auth-card auth-card--exec">
    <h1>بازیابی رمز عبور</h1>
    <p class="muted">ایمیل حساب خود را وارد کنید. لینک تنظیم رمز جدید ارسال می‌شود.</p>
    <form method="post" class="form-stack">{% csrf_token %}
      <div class="field"><label for="id_email">ایمیل</label>{{ form.email }}</div>
      <button class="btn btn-primary" type="submit">ارسال لینک</button>
      <p class="muted" style="margin:0"><a href="{% url 'accounts:login' %}">بازگشت به ورود</a></p>
    </form>
  </div>
</section>
{% endblock %}
