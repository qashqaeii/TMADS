{% load static %}
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2AABEE">
  <title>{% block title %}{{ PRODUCT_NAME }}{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
  <link rel="stylesheet" href="{% static 'css/design-executive.css' %}">
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <script defer src="https://unpkg.com/alpinejs@3.14.8/dist/cdn.min.js"></script>
  <script defer src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
  <script defer src="{% static 'js/lucide-mount.js' %}"></script>
  <script defer src="{% static 'js/motion.js' %}"></script>
  <script defer src="{% static 'js/tmads-tooltips.js' %}"></script>
  {% block extra_head %}{% endblock %}
  {% block charts_head %}{% endblock %}
</head>
<body class="app-body {% block body_class %}{% endblock %}">
  {% block body %}{% endblock %}
  {% if messages %}
  <div class="toast-stack" aria-live="polite">
    {% for message in messages %}
    <div class="toast toast-{{ message.tags }}">{{ message }}</div>
    {% endfor %}
  </div>
  {% endif %}
</body>
</html>
