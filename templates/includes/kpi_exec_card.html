<article class="kpi-exec{% if extra_class %} {{ extra_class }}{% endif %}">
  <span class="kpi-exec__icon">{% include "includes/kpi_icon.html" with name=icon %}</span>
  <div class="kpi-exec__body">
    <span class="kpi-exec__label">{{ label }}</span>
    <span class="kpi-exec__value{% if value_sm %} kpi-exec__value--sm{% endif %}{% if value_class %} {{ value_class }}{% endif %}">{{ value }}{% if suffix %}{{ suffix }}{% endif %}</span>
  </div>
</article>
