<div class="chart-range{% if range_variant %} chart-range--{{ range_variant }}{% endif %}" data-chart-range{% if range_group %} data-range-group="{{ range_group }}"{% endif %} role="group" aria-label="بازهٔ زمانی نمودار">
  {% if range_variant != "minimal" and range_variant != "luxe" %}<span class="chart-range__label muted">بازه</span>{% endif %}
  <button type="button" class="chart-range__btn" data-chart-days="7" aria-pressed="false">۷ روز</button>
  <button type="button" class="chart-range__btn" data-chart-days="14" aria-pressed="false">۱۴ روز</button>
  <button type="button" class="chart-range__btn is-active" data-chart-days="30" aria-pressed="true">۳۰ روز</button>
  <button type="button" class="chart-range__btn" data-chart-days="90" aria-pressed="false">۹۰ روز</button>
  <button type="button" class="chart-range__btn" data-chart-days="0" aria-pressed="false">کل دوره</button>
</div>
