<details class="exec-menu exec-menu--detail campaign-detail__toolbar-item" data-disclosure-menu>
  <summary class="exec-menu__trigger campaign-detail__action campaign-detail__action--more">
    <span class="campaign-detail__action-icon" aria-hidden="true">{% include "includes/lucide_icon.html" with name="ellipsis" size="sm" %}</span>
    <span class="campaign-detail__action-label">بیشتر</span>
  </summary>
  <div class="exec-menu__panel">
    {% if can_edit_campaign %}<a class="exec-menu__item" href="{% url 'campaigns:wizard' campaign.id %}">ویرایش ویزارد</a>{% endif %}
    <form method="post" action="{% url 'campaigns:duplicate' campaign.id %}" class="exec-menu__item">
      {% csrf_token %}<button type="submit">کپی به پیش‌نویس جدید</button>
    </form>
    <a class="exec-menu__item" href="{% url 'campaigns:export_csv' campaign.id %}">خروجی CSV</a>
    {% if can_delete_draft %}
    <form method="post" action="{% url 'campaigns:delete' campaign.id %}" class="exec-menu__item exec-menu__item--danger" onsubmit="return confirm('این پیش‌نویس برای همیشه حذف شود؟');">
      {% csrf_token %}
      <button type="submit">حذف پیش‌نویس</button>
    </form>
    {% endif %}
  </div>
</details>
